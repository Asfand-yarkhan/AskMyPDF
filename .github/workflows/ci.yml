name: CI

on:
  push:
    branches: [main, improved-features]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build & push images
    needs: [backend, frontend]
    # Only on pushes (not PRs) and only when Docker Hub secrets are configured.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKER_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (no Docker Hub secrets)
        if: env.HAS_DOCKER_SECRETS != 'true'
        run: echo "Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets to publish images."
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKER_SECRETS == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_DOCKER_SECRETS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        if: env.HAS_DOCKER_SECRETS == 'true'
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKER_SECRETS == 'true'
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/askmypdf-backend:${{ steps.tags.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/askmypdf-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKER_SECRETS == 'true'
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/askmypdf-frontend:${{ steps.tags.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/askmypdf-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
