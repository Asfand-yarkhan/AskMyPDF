# AskMyPDF: backend (FastAPI) + frontend (nginx serving the React build, proxying /api).
#   docker compose up --build        -> http://localhost:8080
# Secrets come from backend/.env at runtime; they are never copied into the images.

services:
  backend:
    build: ./backend
    image: ${DOCKER_NAMESPACE:-askmypdf}/askmypdf-backend:${TAG:-latest}
    env_file: ./backend/.env
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - askmypdf-data:/app/data   # Chroma index, uploaded PDFs, registry, answer cache
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: ${DOCKER_NAMESPACE:-askmypdf}/askmypdf-frontend:${TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  askmypdf-data:
